# ---------------------------------------------------------------------------
# Research
# ---------------------------------------------------------------------------
- name: arXiv cs.GR
  type: arxiv
  query: cat:cs.GR
  weight: 1.2
  channel: g

- name: arXiv cs.CV (generative video)
  type: arxiv
  query: cat:cs.CV AND (abs:"video generation" OR abs:"video diffusion" OR abs:"neural rendering" OR abs:"gaussian splatting")
  weight: 1.4
  channel: g

- name: Hugging Face daily papers
  type: html
  url: https://huggingface.co/papers
  link_selector: 'a[href^="/papers/"]'
  weight: 1.3
  channel: g

