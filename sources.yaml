# Source list for the AI/VFX dailies digest.
#
# weight: 0.0-2.0 multiplier on relevance score. Signal-dense sources score higher,
#         press-release firehoses score lower. Tune these as you read the digest.
# channel: r = models & tools | g = research | b = industry | a = tutorials
#          (a hint, not a hard label -- the summariser can reclassify)
#
# Run `python -m digest.cli validate` after editing. Feeds rot constantly;
# anything that 404s or goes silent for 60 days gets reported.

# ---------------------------------------------------------------------------
# VFX trade press -- highest signal for you, these people filter for us already
# ---------------------------------------------------------------------------
- name: befores & afters
  type: rss
  url: https://beforesandafters.com/feed/
  weight: 1.8
  channel: b

- name: fxguide
  type: rss
  url: https://www.fxguide.com/feed/
  weight: 1.8
  channel: b

- name: 80 Level
  type: rss
  url: https://80.lv/feed/
  weight: 1.3
  channel: b

- name: CG Channel
  type: rss
  url: https://www.cgchannel.com/feed/
  weight: 1.4
  channel: r

- name: VFX Voice
  type: rss
  url: https://www.vfxvoice.com/feed/
  weight: 1.3
  channel: b

- name: Art of VFX
  type: rss
  url: https://www.artofvfx.com/feed/
  weight: 1.0
  channel: b

- name: Animation World Network
  type: rss
  url: https://www.awn.com/rss.xml
  weight: 0.9
  channel: b

- name: postPerspective
  type: rss
  url: https://postperspective.com/feed/
  weight: 0.9
  channel: b

