name: Verify and publish site fixes
on:
  push:
    branches: [main]
    paths:
      - 'digest/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: digest
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m digest.cli refresh-navigation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
