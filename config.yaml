# Tuning. Edit this file more often than any other -- it is what makes the
# digest yours rather than a generic AI newsletter.

digest:
  title: "Dailies"
  subtitle: "AI in VFX, image and video generation"
  timezone: "Pacific/Auckland"
  # How many clustered stories make the final page. 8-12 is a ~10 minute read.
  max_stories: 10
  # How many raw items get sent to Claude for clustering. Higher = better
  # clustering, more cost. 60 is roughly 25-30k input tokens.
  max_candidates: 60
  # Items older than this are never considered, even if a feed re-publishes them.
  max_age_hours: 36

model:
  # Sonnet handles clustering + summarising well and is the cost sweet spot.
  # Set to claude-opus-5 if you want sharper editorial judgement.
  name: "claude-sonnet-5"
  # Generous headroom above what a 10-story JSON response actually needs
  # (~2-3k tokens) -- the first live run hit exactly 8000/8000 output
  # tokens and came back with nothing parseable, which means something
  # ate the whole budget before the visible answer started.
  max_tokens: 16000

# Watch YouTube videos directly with Gemini rather than judging them by feed
# metadata alone. Catches the videos where the *creator* wasn't making
# anything VFX-related but the workflow underneath is -- a game devlog that
# happens to chain three AI tools together, say -- which the keyword pass
# above would score near zero and never surface. Needs GEMINI_API_KEY.
#
# Also wants YOUTUBE_API_KEY (the official YouTube Data API) for the
# duration/live-status check that runs before spending a Gemini call --
# without it, digest/watch.py falls back to an unofficial scrape that works
# fine locally but is confirmed broken on GitHub Actions specifically
# (YouTube's "sign in to confirm you're not a bot" gate on datacenter IPs,
# not something a different user-agent or endpoint works around). Every
# video defers forever without one when run on schedule.
video_watch:
  enabled: true
  model: "models/gemini-3-flash-preview"
  # Publish if either axis clears this bar. See the JSON contract in
  # digest/watch.py for what topic_relevance and transferable_craft mean.
  publish_threshold: 6
  # Below this, it's a short or a trailer -- not enough runtime to extract a
  # workflow from.
  min_duration_seconds: 90
  # Above this it's not watched unless the channel is marked
  # `long_form_ok: true` in sources.yaml.
  max_duration_minutes: 40
  # Cuts token cost on long videos. Best-effort -- see the comment in
  # watch.py if this stops having any effect after a google-genai upgrade.
  media_resolution_low_after_minutes: 20
  # Gemini's free tier caps at 8h of YouTube video *duration* processed per
  # day, not per call -- track cumulative minutes, not video count. Raise
  # this once billing is turned on for the project.
  daily_quota_minutes: 480

# Your interest profile, in plain language. This is fed to the summariser as
# editorial direction -- it decides what leads and what gets cut. Rewrite it
# the way you'd brief a researcher.
profile: |
  The reader is a technical artist and pipeline TD working in a USD-based
  Houdini/Karma pipeline at a large VFX facility, and separately runs a small
  boutique studio. He writes Python and VEX. He is not a machine-learning
  researcher and does not want paper-summary noise -- but he does want to know
  when a technique is about to become a tool.

  Rank highly:
    - Generative video/image models that are actually controllable: camera
      control, first/last frame, reference conditioning, temporal consistency,
      relighting, video-to-video restyle.
    - Anything that lands inside a DCC or a pipeline: Houdini/Nuke/Maya plugins,
      ComfyUI nodes that a studio could deploy, USD/Hydra integration, OpenColorIO
      and colour-management implications, licensing terms that decide whether a
      model is usable on client work.
    - Open-weight model releases with permissive licences, local VRAM
      requirements, and inference cost.
    - Gaussian splatting, neural rendering, and photogrammetry when it reaches
      production tooling.
    - Studio adoption stories with technical substance -- what they actually
      built, not that they "embraced AI".
    - Legal, union, and rights developments that change what is deliverable.

  Rank low or cut entirely:
    - Model launches described only in marketing language with no technical
      detail or availability.
    - Funding rounds and valuations, unless they change a product's availability
      or licence.
    - Consumer/social AI app news with no production relevance.
    - "AI will replace artists" opinion pieces with no new information.
    - Benchmark leaderboard churn between near-identical models.

# Cheap keyword prefilter, applied before anything reaches Claude.
# Each match adds to the score; the top `max_candidates` items survive.
keywords:
  strong:   # +3.0
    - houdini
    - nuke
    - comfyui
    - openusd
    - usd
    - karma
    - solaris
    - gaussian splat
    - open-weight
    - open weights
    - apache 2.0
    - video-to-video
    - temporal consistency
    - camera control
    - relight
    - rotoscop
    - matchmove
    - openColorIO
    - aces
  medium:   # +1.5
    - diffusion
    - video generation
    - image-to-video
    - text-to-video
    - neural render
    - nerf
    - photogrammetry
    - lora
    - controlnet
    - inference
    - vram
    - upscal
    - depth estimation
    - segmentation
    - pipeline
    - vfx
    - compositing
    - previs
    - virtual production
  weak:     # +0.5
    - generative
    - model
    - render
    - animation
    - 3d
    - texture
    - shader
  negative: # -2.0
    - funding round
    - series a
    - series b
    - valuation
    - stock price
    - webinar
    - discount
    - black friday
    - giveaway
    - sponsored
    - "top 10 best"
    - "is it worth it"
    - "best 5"
    - "(compared)"
    - horoscope

delivery:
  html: true
  # Off for now -- page-only delivery. Flip to true (and add either
  # DISCORD_WEBHOOK_URL or the bot secrets) whenever you want it back.
  discord: false
  # Only the top N stories get pushed to Discord, to keep the channel readable.
  # The web page always carries everything.
  discord_min_rank: 3
  # "bot"     -- posts one message per story and seeds thumb reactions, so a tap
  #              becomes a rating. Needs DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID.
  # "webhook" -- simpler setup, one combined message, but no reaction ratings.
  # Bot mode falls back to webhook automatically if the token is missing.
  discord_mode: bot

sharing:
  # Public URL of the page, used for per-story permalinks and the Discord link.
  # Fill this in after your first Pages deploy.
  page_url: "https://whizasylum.github.io/ai-vfx-dailies/"
  # GitHub Pages on a free or Pro account cannot restrict who views a page --
  # see the sharing section of the README. This at least keeps it out of search
  # results so the link only spreads to people you send it to.
  noindex: true
  # Pinged in the Discord header. Use a role mention like "<@&123456789>",
  # or leave empty for no ping. Plain @everyone is deliberately not supported.
  discord_mention: ""
  # Cloudflare Worker URL that turns a single tap into a GitHub issue (see
  # cloudflare/rating-worker.js). Rating buttons only show up on the page
  # once this is set -- empty means no ratings UI at all.
  rating_endpoint: "https://ai-vfx-dailies-rating.falling-pine-24e5.workers.dev/"

feedback:
  enabled: true
  # Ratings only steer the summariser once there are at least this many.
  # Below it, a couple of stray taps would swing the whole digest.
  min_ratings_to_calibrate: 6
  # How many liked / not-liked headlines go into the prompt as examples.
  examples_per_side: 8

# Optional GPT Image illustrations for stories whose feeds provide no image.
# Adding OPENAI_API_KEY as an Actions secret activates this. No key = free
# built-in editorial graphics. Source images are always preferred.
thumbnails:
  enabled: true
  model: "gpt-image-2.5-flare"
  quality: "low"
  # Attempts, including failures, across all reruns in the digest's local day.
  max_per_day: 2
